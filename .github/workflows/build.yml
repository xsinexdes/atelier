name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compilar
        run: mvn -B -ntp package
      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: Atelier-jar
          path: target/Atelier-*.jar
